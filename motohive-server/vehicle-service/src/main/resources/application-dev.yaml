server:
  port: 8082

spring:
  # ── H2 In-Memory Database ─────────────────────────
  datasource:
    url: jdbc:h2:mem:vehicles
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ── H2 Console (browser UI) ───────────────────────
  h2:
    console:
      enabled: true
      path: /h2-console       # http://localhost:8082/h2-console

  # ── JPA override for dev ──────────────────────────
  jpa:
    hibernate:
      ddl-auto: update          # Flyway owns schema — not Hibernate
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

  # ── Flyway H2 override ────────────────────────────
    flyway:
      enabled: false
      locations: classpath:db/dev   # migration + seed data
      baseline-on-migrate: true
      clean-disabled: false

  # SQL data load
#  sql:
  #    init:
  #      mode: always  # Always run data.sql on startup
#        data-locations: classpath:db/dev/data.sql
#        schema-locations: classpath:db/dev/schema.sql

  devtools:
    restart:
      enabled: false

  # ── Disable Kafka in dev (no Kafka needed for H2 testing) ──
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

logging:
  level:
    com.motohive.paymentservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.flywaydb: DEBUG

springdoc:
  swagger-ui:
    try-it-out-enabled: true