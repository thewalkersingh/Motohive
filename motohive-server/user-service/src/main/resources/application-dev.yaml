spring:
  datasource:
    url: jdbc:h2:mem:users;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  flyway:
    enabled: false
  devtools:
    restart:
      enabled: false
server:
  port: 8081
springdoc:
  swagger-ui:
    try-it-out-enabled: true
logging:
  level:
    com.motohive.userservice: DEBUG