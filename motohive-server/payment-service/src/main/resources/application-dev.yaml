spring:
  mvc:
    throw-exception-if-no-handler-found: false
  web:
    resources:
      add-mappings: false   # ← disables Spring's default static resource handling

  # ── H2 In-Memory Database ─────────────────────────
  datasource:
    url: jdbc:h2:mem:motohive_payments;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ── H2 Console (browser UI) ───────────────────────
  #    h2:
  #      console:
  #        enabled: true
  #        path: /h2-console       # http://localhost:8084/h2-console

  # disable spring's default security headers in dev
  security:
    ignored: "/**"

  # ── JPA override for dev ──────────────────────────
  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns schema — not Hibernate
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

  # ── Flyway H2 override ────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev   # migration + seed data
    baseline-on-migrate: true
    clean-disabled: false

  # ── Disable Kafka in dev (no Kafka needed for H2 testing) ──
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ── Auto-configure mock Kafka ─────────────────────
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

logging:
  level:
    com.motohive.paymentservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.flywaydb: DEBUG
    org.springframework.web: DEBUG