server:
  port: 8084

spring:
  application:
    name: payment-service
    # ── Active profile ─────────────────────────────────
  #    profiles:
  #      active: ${APP_PROFILE:dev}    # defaults to dev, override with APP_PROFILE=prod

  ## --- Make this active if you need to save data to MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/motohive_payments?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: PaymentServiceHikariPool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true # add this to prevent JPA table validation before table creation by flyway
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

motohive:
  payment:
    platform-fee-percent: 2.50    # default platform fee
    mock-processing-delay-ms: 500 # simulates gateway delay

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method       # sorts by GET/POST/PATCH/DELETE
    tags-sorter: alpha              # sorts controllers alphabetically
    try-it-out-enabled: true        # enables Try it out by default
  show-actuator: false

logging:
  level:
    com.motohive.paymentservice: DEBUG
    org.springframework.kafka: INFO